apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: lareinette
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lareinette
      tier: frontend
  template:
    metadata:
      labels:
        app: lareinette
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: lareinette-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: lareinette-config
              key: VITE_SUPABASE_URL
        - name: VITE_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: lareinette-secrets
              key: VITE_SUPABASE_ANON_KEY
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: lareinette
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
